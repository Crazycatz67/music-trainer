<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sing a song · Music trainer</title>
<script>
  // Set the sky first, a copy of index.html's pre-paint (same storage key, same answers as
  // resolveSky() in js/app/config.js; themes.check.mjs compares all three), so even the one
  // frame before the redirect is the singer's sky, never a Dusk flash on a Nebula night.
  (function () {
    var theme = null, mq = function (q) { return window.matchMedia(q).matches; };
    try { theme = (JSON.parse(localStorage.getItem('music-trainer.settings.v1') || '{}') || {}).theme; } catch (e) { /* use the system setting */ }
    if (theme !== 'dusk' && theme !== 'dawn' && theme !== 'nebula' && theme !== 'midnight') {
      theme = mq('(prefers-color-scheme: light)') ? 'dawn' : mq('(prefers-contrast: more)') ? 'midnight' : 'dusk';
    }
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.tone = theme === 'dawn' ? 'light' : 'dark';
  })();
</script>
<script>
  // Songs live in the app now (page-layout spec, slice S3): this page only forwards old
  // links and bookmarks to index.html#/songs, keeping the query (?models=local for test
  // runs). replace(), so Back does not land here again. It runs before <body> is parsed,
  // so nothing of a page is painted first.
  location.replace('index.html' + location.search + '#/songs');
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html#/songs"></noscript>
<style>/* the four --bg values of css/tokens.css (no stylesheet loads on this page) */
  html, html[data-theme="dusk"] { background: #0b1020; } html[data-theme="dawn"] { background: #f7f5ef; }
  html[data-theme="nebula"] { background: #120b22; } html[data-theme="midnight"] { background: #000000; }</style>
</head>
<body>
<p><a href="index.html#/songs">Songs have moved into the app: open Songs</a></p>
</body>
</html>
