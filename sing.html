<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sing a song · Music trainer</title>
<script>
  // Set the theme first (the same rule and storage key as index.html), so even the one
  // frame before the redirect is the singer's sky colour, never a white flash.
  (function () {
    var theme = null;
    try { theme = (JSON.parse(localStorage.getItem('music-trainer.settings.v1') || '{}') || {}).theme; } catch (e) { /* use the system setting */ }
    if (theme !== 'dusk' && theme !== 'dawn') theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'dawn' : 'dusk';
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.tone = theme === 'dawn' ? 'light' : 'dark';
  })();
  // Songs live in the app now (page-layout spec, slice S3): this page only forwards old
  // links and bookmarks to index.html#/songs, keeping the query (?models=local for test
  // runs). replace(), so Back does not land here again. It runs before <body> is parsed,
  // so nothing of a page is painted first.
  location.replace('index.html' + location.search + '#/songs');
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html#/songs"></noscript>
<style>/* the two --bg values of css/tokens.css */ html { background: #0b1020; } html[data-tone="light"] { background: #f7f5ef; }</style>
</head>
<body>
<p><a href="index.html#/songs">Songs have moved into the app: open Songs</a></p>
</body>
</html>
